<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reading Archive</title>
    <style>
        /* --- CORE PALETTE & TYPOGRAPHY --- */
        :root { --bg-dark: #1a102a; --text-main: #ffb74d; --accent: #e066a3; --panel-bg: #2a1b40; }
        body { margin: 0; font-family: 'Courier New', monospace; background-color: var(--bg-dark); color: white; display: flex; height: 100vh; overflow: hidden; }

        /* --- THE PUSHING SIDEBAR --- */
        .sidebar { width: 280px; background-color: var(--panel-bg); display: flex; flex-direction: column; transition: margin-left 0.3s ease; box-shadow: 5px 0 20px rgba(0,0,0,0.8); z-index: 1000; height: 100vh; flex-shrink: 0; border-right: 2px solid var(--accent); }
        .sidebar.collapsed { margin-left: -280px; }
        
        .sidebar-menu { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; flex-grow: 1; }
        .sidebar-menu li { border-bottom: 1px solid var(--accent); }
        .sidebar-menu li:last-child { border-bottom: none; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 15px; padding: 20px; color: var(--text-main); text-decoration: none; font-size: 1.1em; font-family: 'Courier New', monospace; font-weight: bold; transition: 0.2s; }
        .sidebar-menu li a:hover { background-color: rgba(224, 102, 163, 0.2); padding-left: 30px; border-left: 5px solid var(--accent); }

        .sign-out-container { margin-top: auto; border-top: 2px solid var(--accent); background: rgba(211, 47, 47, 0.1); }
        .sign-out-container a { display: flex; align-items: center; gap: 15px; padding: 20px; color: #d32f2f; text-decoration: none; font-size: 1.1em; font-weight: bold; transition: 0.2s; }
        .sign-out-container a:hover { background-color: rgba(211, 47, 47, 0.2); padding-left: 30px; border-left: 5px solid #d32f2f; }

        /* --- MAIN CONTENT & TOPBAR --- */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; width: 100%; position: relative; overflow-y: auto;}
        
        .topbar { position: relative; height: 70px; background: var(--panel-bg); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 2px solid var(--accent); flex-shrink: 0; }
        
        /* Menu Icon & Back Button sit side-by-side cleanly at the left edge */
        .topbar-left { display: flex; align-items: center; gap: 20px; position: absolute; left: 20px; height: 100%; }
        
        .menu-toggle { background: var(--bg-dark); border: 2px solid var(--accent); color: var(--accent); font-size: 1.5em; cursor: pointer; border-radius: 5px; transition: 0.2s; display: flex; align-items: center; justify-content: center; height: 45px; width: 50px; padding: 0; }
        .menu-toggle:hover { background-color: var(--accent); color: white; box-shadow: 0 0 10px var(--accent); }
        
        .back-btn { color: var(--text-main); text-decoration: none; font-weight: bold; font-size: 1.2em; transition: 0.2s; display: flex; align-items: center; }
        .back-btn:hover { color: var(--accent); }

        /* Edit Button aligns to the right */
        .topbar-right { position: absolute; right: 20px; display: flex; align-items: center; }
        #editBtn { background: #d32f2f; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-family: inherit; font-weight: bold; display: none; transition: 0.2s; }
        #editBtn:hover { box-shadow: 0 0 15px #d32f2f; transform: scale(1.05); }

        /* --- READER CONTENT STYLES --- */
        .reader-container { max-width: 800px; margin: 40px auto; padding: 40px; background: var(--panel-bg); border-radius: 10px; border: 1px solid rgba(224, 102, 163, 0.3); width: 100%; box-sizing: border-box; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        h1 { color: var(--text-main); border-bottom: 1px dashed var(--accent); padding-bottom: 15px; margin-top: 0; }
        
        .content { line-height: 1.6; font-size: 1.1em; }
        .content img { max-width: 100%; border-radius: 5px; margin: 15px 0; }
    </style>
</head>
<body>

    <nav class="sidebar collapsed" id="sidebar">
        <ul class="sidebar-menu">
            <li><a href="/" id="sb-home">🏠︎ Main Menu</a></li>
            <li><a href="/documentation" id="sb-docs"> 🕮 Documentation</a></li>
            <li><a href="/leaderboard" id="sb-lead">🎖 Leaderboards</a></li>
            <li><a href="/credits" id="sb-cred">⏻ System Architects</a></li>
            <li id="sb-admin-li" style="display: none;"><a href="/supersecretcyber-panel" id="sb-admin">⚙︎ Mission Control</a></li>
        </ul>
        
        <div class="sign-out-container">
            <a href="/login" id="sb-logout">➜] Sign Out</a>
        </div>
    </nav>

    <div class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <a href="#" id="backLink" class="back-btn">◄ Back to Index</a>
            </div>
            <div class="topbar-right">
                <button id="editBtn" onclick="editDoc()">⚙️ Edit Document</button>
            </div>
        </header>

        <div class="reader-container">
            <h1 id="docTitle">Loading...</h1>
            <div id="docContent" class="content">Decrypting files...</div>
        </div>
    </div>

<script>
    // --- UNIVERSAL SIDEBAR LOGIC ---
    function toggleSidebar() { 
        document.getElementById('sidebar').classList.toggle('collapsed'); 
    }
    
    // Auto-attach admin keys to all sidebar links when the page loads
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const adminQuery = urlParams.has('admin') ? `?admin=${urlParams.has('admin')}` : '';
        
        const links = ['sb-home', 'sb-docs', 'sb-lead', 'sb-cred', 'sb-logout'];
        links.forEach(id => {
            const el = document.getElementById(id);
            if (el && adminQuery) el.href += adminQuery;
        });

        if (urlParams.get('admin')) {
            document.getElementById('sb-admin-li').style.display = 'block';
            document.getElementById('sb-admin').href += adminQuery;
        }
    });
    
    const docId = window.location.pathname.split('/').pop();
    const urlParams = new URLSearchParams(window.location.search);
    const adminQuery = urlParams.has('admin') ? `?admin=${urlParams.get('admin')}` : '';
    
    document.getElementById('backLink').href = '/documentation' + adminQuery;

    if (urlParams.has('admin')) {
        document.getElementById('editBtn').style.display = 'block';
    }

    async function loadDoc() {
        const res = await fetch(`/api/document/${docId}${adminQuery}`);
        if (!res.ok) { document.getElementById('docTitle').innerText = "ERROR 404"; return; }
        const doc = await res.json();
        document.getElementById('docTitle').innerText = doc.title;
        document.getElementById('docContent').innerHTML = doc.content;
    }

    function editDoc() { window.location.href = `/documentation/edit/${docId}${adminQuery}`; }
    window.onload = loadDoc;
</script>
</body>
</html>
