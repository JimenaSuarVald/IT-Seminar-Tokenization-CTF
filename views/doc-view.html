<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reading Archive</title>
    <style>
        :root { --bg-dark: #1a102a; --text-main: #ffb74d; --accent: #e066a3; --panel-bg: #2a1b40; }
        body { margin: 0; font-family: 'Courier New', monospace; background-color: var(--bg-dark); color: white; display: flex; flex-direction: column; height: 100vh; }
        .topbar { height: 60px; background: var(--panel-bg); display: flex; align-items: center; padding: 0 20px; border-bottom: 2px solid var(--accent); }
        .back-btn { color: var(--text-main); text-decoration: none; font-weight: bold; font-size: 1.2em; transition: 0.2s; }
        .back-btn:hover { color: var(--accent); }
        
        .reader-container { max-width: 800px; margin: 40px auto; padding: 40px; background: var(--panel-bg); border-radius: 10px; border: 1px solid rgba(224, 102, 163, 0.3); width: 100%; box-shadow: 0 0 20px rgba(0,0,0,0.5); overflow-y: auto;}
        h1 { color: var(--text-main); border-bottom: 1px dashed var(--accent); padding-bottom: 15px; margin-top: 0; }
        
        /* Rich Text Formatting */
        .content { line-height: 1.6; font-size: 1.1em; }
        .content img { max-width: 100%; border-radius: 5px; margin: 15px 0; }
        
        #editBtn { display: none; background: #d32f2f; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 5px; font-family: inherit; margin-left: auto; font-weight: bold;}
        /* --- UNIVERSAL FLOATING SIDEBAR --- */
        .menu-toggle {
            position: fixed; top: 15px; left: 15px; z-index: 1001;
            background: var(--bg-dark, #1a102a); border: 2px solid var(--accent, #e066a3); 
            color: var(--accent, #e066a3); font-size: 1.5em; cursor: pointer; 
            border-radius: 5px; padding: 5px 12px; transition: 0.2s; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .menu-toggle:hover { background-color: var(--accent, #e066a3); color: white; box-shadow: 0 0 15px var(--accent, #e066a3); }

        /* The Push Animation for the whole site */
        body { transition: margin-left 0.3s ease !important; margin-left: 0; }
        body.sidebar-open { margin-left: 280px; }

        .sidebar {
            position: fixed; top: 0; left: 0; width: 280px; height: 100vh;
            background-color: var(--panel-bg, #2a1b40);
            transition: transform 0.3s ease; box-shadow: 5px 0 20px rgba(0,0,0,0.8); z-index: 1000;
            display: flex; flex-direction: column; padding-top: 70px; 
            border-right: 2px solid var(--accent, #e066a3);
            box-sizing: border-box; /* FIX: Keeps the Sign Out button safely on the screen! */
        }
        .sidebar.collapsed { transform: translateX(-100%); }
        
        .sidebar-menu { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; flex-grow: 1; }
        .sidebar-menu li { border-bottom: 1px solid var(--accent, #e066a3); }
        .sidebar-menu li:last-child { border-bottom: none; }
        .sidebar-menu li a {
            display: flex; align-items: center; gap: 15px; padding: 20px;
            color: var(--text-main, #ffb74d); text-decoration: none; font-size: 1.1em; 
            font-family: 'Courier New', monospace; font-weight: bold; transition: 0.2s;
        }
        .sidebar-menu li a:hover {
            background-color: rgba(224, 102, 163, 0.2); padding-left: 30px; border-left: 5px solid var(--accent, #e066a3);
        }

        /* --- DEDICATED SIGN OUT ANCHOR --- */
        .sign-out-container { 
            margin-top: auto; 
            border-top: 2px solid var(--accent, #e066a3); 
            background: rgba(211, 47, 47, 0.1); 
        }
        .sign-out-container a { 
            display: flex; align-items: center; gap: 15px; padding: 20px;
            color: #d32f2f; text-decoration: none; font-size: 1.1em; 
            font-family: 'Courier New', monospace; font-weight: bold; transition: 0.2s;
        }
        .sign-out-container a:hover { 
            background-color: rgba(211, 47, 47, 0.2); padding-left: 30px; border-left: 5px solid #d32f2f; 
        }

        /* --- COLLISION FIXES --- */
        /* Pushes the clock over */
        .topbar-left { left: 80px !important; }
        /* Pushes the "Back to Terminal" links over */
        a[href="javascript:history.back()"] { margin-left: 60px; display: inline-block; }
    </style>
</head>
<body>
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

    <nav class="sidebar collapsed" id="sidebar">
        <ul class="sidebar-menu">
            <li><a href="/" id="sb-home">🏠 Main Menu</a></li>
            <li><a href="/documentation" id="sb-docs">📄 Documentation</a></li>
            <li><a href="/leaderboard" id="sb-lead">🏆 Leaderboards</a></li>
            <li><a href="/credits" id="sb-cred">👨‍💻 System Architects</a></li>
            
            <li id="sb-admin-li" style="display: none;"><a href="/supersecretcyber-panel" id="sb-admin">⚙️ Mission Control</a></li>
        </ul>
        
        <div class="sign-out-container">
            <a href="/login" id="sb-logout">🚪 Sign Out</a>
        </div>
    </nav>

    <div class="topbar">
        <a href="#" id="backLink" class="back-btn">◄ Back to Index</a>
        <button id="editBtn" onclick="editDoc()">⚙️ Edit Document</button>
    </div>

    <div class="reader-container">
        <h1 id="docTitle">Loading...</h1>
        <div id="docContent" class="content">Decrypting files...</div>
    </div>

<script>
// --- UNIVERSAL SIDEBAR LOGIC ---
    function toggleSidebar() { 
        document.getElementById('sidebar').classList.toggle('collapsed'); 
        document.body.classList.toggle('sidebar-open'); // FIX: Pushes the website over!
    }
    
    // Auto-attach admin keys to all sidebar links when the page loads
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const adminQuery = urlParams.has('admin') ? `?admin=${urlParams.get('admin')}` : '';
        
        const links = ['sb-home', 'sb-docs', 'sb-lead', 'sb-cred', 'sb-logout'];
        links.forEach(id => {
            const el = document.getElementById(id);
            if (el && adminQuery) el.href += adminQuery;
        });

        // Show Mission Control button ONLY if they have the admin key in the URL
        if (urlParams.get('admin') === 'jillian') {
            document.getElementById('sb-admin-li').style.display = 'block';
            document.getElementById('sb-admin').href += adminQuery;
        }
    });
    
    const docId = window.location.pathname.split('/').pop();
    const urlParams = new URLSearchParams(window.location.search);
    const adminQuery = urlParams.has('admin') ? `?admin=${urlParams.get('admin')}` : '';
    
    document.getElementById('backLink').href = '/documentation' + adminQuery;

    if (urlParams.get('admin') === 'jillian') {
        document.getElementById('editBtn').style.display = 'block';
    }

    async function loadDoc() {
        const res = await fetch(`/api/document/${docId}${adminQuery}`);
        if (!res.ok) { document.getElementById('docTitle').innerText = "ERROR 404"; return; }
        const doc = await res.json();
        document.getElementById('docTitle').innerText = doc.title;
        document.getElementById('docContent').innerHTML = doc.content;
    }

    function editDoc() { window.location.href = `/documentation/edit/${docId}${adminQuery}`; }
    window.onload = loadDoc;
</script>
</body>
</html>
