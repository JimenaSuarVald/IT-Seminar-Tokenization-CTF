<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Profile</title>
    <style>
        /* --- UNIVERSAL FLOATING SIDEBAR --- */
        .menu-toggle {
            position: fixed; top: 15px; left: 15px; z-index: 1001;
            background: var(--bg-dark, #1a102a); border: 2px solid var(--accent, #e066a3); 
            color: var(--accent, #e066a3); font-size: 1.5em; cursor: pointer; 
            border-radius: 5px; padding: 5px 12px; transition: 0.2s; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .menu-toggle:hover { background-color: var(--accent, #e066a3); color: white; box-shadow: 0 0 15px var(--accent, #e066a3); }

        .sidebar {
            position: fixed; top: 0; left: 0; width: 280px; height: 100vh;
            background-color: var(--panel-bg, #2a1b40);
            transition: transform 0.3s ease; box-shadow: 5px 0 20px rgba(0,0,0,0.8); z-index: 1000;
            display: flex; flex-direction: column; padding-top: 70px; 
            border-right: 2px solid var(--accent, #e066a3);
        }
        .sidebar.collapsed { transform: translateX(-100%); }
        
        .sidebar-menu { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; flex-grow: 1; }
        
        /* The dividing line between buttons */
        .sidebar-menu li { border-bottom: 1px solid var(--accent, #e066a3); }
        .sidebar-menu li:last-child { border-bottom: none; }
        
        /* The text and icons */
        .sidebar-menu li a {
            display: flex; align-items: center; gap: 15px; padding: 20px;
            color: var(--text-main, #ffb74d); text-decoration: none; font-size: 1.1em; 
            font-family: 'Courier New', monospace; font-weight: bold; transition: 0.2s;
        }
        .sidebar-menu li a:hover {
            background-color: rgba(224, 102, 163, 0.2); padding-left: 30px; border-left: 5px solid var(--accent, #e066a3);
        }

        /* --- DEDICATED SIGN OUT ANCHOR --- */
        .sign-out-container { 
            margin-top: auto; 
            border-top: 2px solid var(--accent, #e066a3); 
            background: rgba(211, 47, 47, 0.1); 
        }
        .sign-out-container a { 
            display: flex; align-items: center; gap: 15px; padding: 20px;
            color: #d32f2f; text-decoration: none; font-size: 1.1em; 
            font-family: 'Courier New', monospace; font-weight: bold; transition: 0.2s;
        }
        .sign-out-container a:hover { 
            background-color: rgba(211, 47, 47, 0.2); padding-left: 30px; border-left: 5px solid #d32f2f; 
        }

        :root { --bg-dark: #1a102a; --text-main: #ffb74d; --accent: #e066a3; --panel-bg: #2a1b40; }
        body { margin: 0; font-family: 'Courier New', Courier, monospace; background-color: var(--bg-dark); color: var(--text-main); display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        .profile-card { background: var(--panel-bg); padding: 50px; border-radius: 20px; border: 1px solid var(--accent); box-shadow: 0 0 30px rgba(224, 102, 163, 0.3); width: 400px; text-align: center; color: white; }
        
        .icon-circle { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--text-main); display: flex; align-items: center; justify-content: center; background-color: var(--bg-dark); margin: 0 auto 20px auto; }
        .icon-circle svg { width: 50px; height: 50px; stroke: var(--text-main); }
        
        .stat-box { background: var(--bg-dark); padding: 20px; border-radius: 10px; border: 1px solid rgba(255, 183, 77, 0.3); margin-top: 20px; }
        
        .back-btn { display: inline-block; margin-top: 30px; padding: 10px 20px; background: none; border: 2px solid var(--accent); color: var(--accent); text-decoration: none; border-radius: 5px; font-weight: bold; transition: 0.2s; cursor: pointer; }
        .back-btn:hover { background: var(--accent); color: var(--bg-dark); }
    </style>
</head>
<body>

    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

    <nav class="sidebar collapsed" id="sidebar">
        <ul class="sidebar-menu">
            <li><a href="/" id="sb-home">🏠 Main Menu</a></li>
            <li><a href="/documentation" id="sb-docs">📄 Documentation</a></li>
            <li><a href="/leaderboard" id="sb-lead">🏆 Leaderboards</a></li>
            <li><a href="/credits" id="sb-cred">👨‍💻 System Architects</a></li>
            
            <li id="sb-admin-li" style="display: none;"><a href="/supersecretcyber-panel" id="sb-admin">⚙️ Mission Control</a></li>
        </ul>
        
        <div class="sign-out-container">
            <a href="/login" id="sb-logout">🚪 Sign Out</a>
        </div>
    </nav>

    <div class="profile-card">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
        <h1 id="prof-username" style="margin-top: 0; color: var(--text-main); letter-spacing: 2px;">LOADING...</h1>
        
        <div class="stat-box">
            <h1 id="prof-score" style="margin: 0; color: var(--accent); font-size: 3.5em;">0</h1>
            <p style="margin: 0; color: #ccc; font-weight: bold; letter-spacing: 1px;">TOTAL SCORE</p>
        </div>
        
        <div class="stat-box">
            <h2 id="prof-completed" style="margin: 0; font-size: 2.5em;">0</h2>
            <p style="margin: 0; color: #ccc;">TASKS COMPLETED</p>
        </div>

        <button class="back-btn" onclick="goBack()">Return to Mission Control</button>
    </div>

<script>

    // --- UNIVERSAL SIDEBAR LOGIC ---
    function toggleSidebar() { 
        document.getElementById('sidebar').classList.toggle('collapsed'); 
    }
    
    // Auto-attach admin keys to all sidebar links when the page loads
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const adminQuery = urlParams.has('admin') ? `?admin=${urlParams.get('admin')}` : '';
        
        const links = ['sb-home', 'sb-docs', 'sb-lead', 'sb-cred', 'sb-logout'];
        links.forEach(id => {
            const el = document.getElementById(id);
            if (el && adminQuery) el.href += adminQuery;
        });

        // Show Mission Control button ONLY if they have the admin key in the URL
        if (urlParams.get('admin') === 'jillian') {
            document.getElementById('sb-admin-li').style.display = 'block';
            document.getElementById('sb-admin').href += adminQuery;
        }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const adminQuery = urlParams.has('admin') ? `?admin=${urlParams.get('admin')}` : '';

    function goBack() {
        window.location.href = '/' + adminQuery;
    }

    async function loadProfile() {
        try {
            const res = await fetch('/api/me' + adminQuery);
            if(res.ok) {
                const user = await res.json();
                document.getElementById('prof-username').innerText = user.username.toUpperCase();
                document.getElementById('prof-score').innerText = user.score;
                
                const completedCount = user.found_flags ? user.found_flags.split(',').filter(x => x).length : 0;
                document.getElementById('prof-completed').innerText = completedCount;
            } else {
                document.getElementById('prof-username').innerText = "SESSION ERROR";
            }
        } catch(e) {
            console.error(e);
        }
    }

    loadProfile();
</script>
</body>
</html>
