<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CTF Task</title>
    <style>

        /* --- UNIVERSAL FLOATING SIDEBAR --- */
        .menu-toggle {
            position: fixed; top: 15px; left: 15px; z-index: 1001;
            background: var(--bg-dark, #1a102a); border: 2px solid var(--accent, #e066a3); 
            color: var(--accent, #e066a3); font-size: 1.5em; cursor: pointer; 
            border-radius: 5px; padding: 5px 12px; transition: 0.2s; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .menu-toggle:hover { background-color: var(--accent, #e066a3); color: white; box-shadow: 0 0 15px var(--accent, #e066a3); }

        /* The Push Animation for the whole site */
        body { transition: margin-left 0.3s ease !important; margin-left: 0; }
        body.sidebar-open { margin-left: 280px; }

        .sidebar {
            position: fixed; top: 0; left: 0; width: 280px; height: 100vh;
            background-color: var(--panel-bg, #2a1b40);
            transition: transform 0.3s ease; box-shadow: 5px 0 20px rgba(0,0,0,0.8); z-index: 1000;
            display: flex; flex-direction: column; padding-top: 70px; 
            border-right: 2px solid var(--accent, #e066a3);
            box-sizing: border-box; /* FIX: Keeps the Sign Out button safely on the screen! */
        }
        .sidebar.collapsed { transform: translateX(-100%); }
        
        .sidebar-menu { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; flex-grow: 1; }
        .sidebar-menu li { border-bottom: 1px solid var(--accent, #e066a3); }
        .sidebar-menu li:last-child { border-bottom: none; }
        .sidebar-menu li a {
            display: flex; align-items: center; gap: 15px; padding: 20px;
            color: var(--text-main, #ffb74d); text-decoration: none; font-size: 1.1em; 
            font-family: 'Courier New', monospace; font-weight: bold; transition: 0.2s;
        }
        .sidebar-menu li a:hover {
            background-color: rgba(224, 102, 163, 0.2); padding-left: 30px; border-left: 5px solid var(--accent, #e066a3);
        }

        /* --- DEDICATED SIGN OUT ANCHOR --- */
        .sign-out-container { 
            margin-top: auto; 
            border-top: 2px solid var(--accent, #e066a3); 
            background: rgba(211, 47, 47, 0.1); 
        }
        .sign-out-container a { 
            display: flex; align-items: center; gap: 15px; padding: 20px;
            color: #d32f2f; text-decoration: none; font-size: 1.1em; 
            font-family: 'Courier New', monospace; font-weight: bold; transition: 0.2s;
        }
        .sign-out-container a:hover { 
            background-color: rgba(211, 47, 47, 0.2); padding-left: 30px; border-left: 5px solid #d32f2f; 
        }

        /* --- COLLISION FIXES --- */
        /* Pushes the clock over */
        .topbar-left { left: 80px !important; }
        /* Pushes the "Back to Terminal" links over */
        a[href="javascript:history.back()"] { margin-left: 60px; display: inline-block; }

        :root { --bg: #1a102a; --panel: #2a1b40; --accent: #e066a3; --text: #ffb74d; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; padding: 30px; max-width: 800px; margin: 0 auto; }
        
        .card { background: var(--panel); border: 1px solid var(--accent); border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 20px;}
        .task-image { width: 100%; max-height: 400px; object-fit: cover; border-radius: 10px; margin-bottom: 20px; }
        
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; background: #110a1c; border: 1px solid var(--accent); color: white; border-radius: 5px; font-family: inherit;}
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; font-family: inherit;}
        button:hover { filter: brightness(1.2); }
        
        .hidden { display: none !important; }
        #editModeBtn { background: #d32f2f; margin-bottom: 20px; display: inline-block; }
    /* --- RICH TEXT IMAGE FIX --- */
        #taskContent img {
            max-width: 100% !important; 
            height: auto !important; 
            display: block; 
            margin: 20px auto; /* Centers the image nicely */
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); /* Optional: adds a nice drop shadow */
        }
        
        /* Also ensures long URLs or code blocks don't break the container */
        #taskContent {
            overflow-wrap: break-word;
            word-wrap: break-word;
            overflow-x: auto;
        }
    
    </style>
</head>
<body>

    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

    <nav class="sidebar collapsed" id="sidebar">
        <ul class="sidebar-menu">
            <li><a href="/" id="sb-home">🏠︎ Main Menu</a></li>
            <li><a href="/documentation" id="sb-docs"> 🕮 Documentation</a></li>
            <li><a href="/leaderboard" id="sb-lead">🎖 Leaderboards</a></li>
            <li><a href="/credits" id="sb-cred">⏻ System Architects</a></li>
            
            <li id="sb-admin-li" style="display: none;"><a href="/supersecretcyber-panel" id="sb-admin">⚙︎ Mission Control</a></li>
        </ul>
        
        <div class="sign-out-container">
            <a href="/login" id="sb-logout">➜] Sign Out</a>
        </div>
    </nav>


    <div style="display: flex; justify-content: space-between; align-items: center;">
        <a href="javascript:history.back()" style="color: var(--accent); text-decoration: none;">◄ BACK TO TERMINAL</a>
        
        <div style="display: flex; gap: 15px; align-items: center;">
            <div id="activeTimer" style="color: #ffb74d; font-weight: bold; font-size: 1.2em; display: none;">
                ⏱ Time Spent: <span id="timeElapsed">00:00</span>
            </div>
            
            <button id="editModeBtn" class="hidden">⚙︎ EDIT TASK</button>
        </div>
    </div>
    <br><br>

    <div class="card" id="playerPanel">
        <h1 id="taskName" style="font-size: 2.5em; margin-bottom: 5px;">Loading...</h1>
        
        <p style="color: #ccc; font-weight: bold;">⏱ Time: <span id="taskTime" style="color: var(--text);">...</span> | ✪ Points: <span id="taskPoints" style="color: var(--text);">...</span></p>
        
        <img id="taskImage" src="" class="task-image" alt="Task Image" style="display: none;">
        
        <div id="taskDesc" style="font-size: 1.2em; line-height: 1.6; color: white;"></div>
        
        <hr style="border-color: var(--accent); margin: 30px 0;">

        <div id="taskContent" style="background: rgba(0,0,0,0.2); padding: 25px; border-radius: 10px; margin: 30px 0;">
            <em>Task details will load here...</em>
        </div>
        
        <h3>SUBMIT FLAG</h3>
        <input type="text" id="flagInput" placeholder="CTF{type_your_flag_here}">
        <button onclick="submitFlag()">Submit</button>

    </div>

    <script>
        const taskIdentifier = decodeURIComponent(window.location.pathname.split('/').pop());
        const urlParams = new URLSearchParams(window.location.search);
        const adminKey = urlParams.get('admin');

       // --- UNIVERSAL SIDEBAR LOGIC ---
    function toggleSidebar() { 
        document.getElementById('sidebar').classList.toggle('collapsed'); 
        document.body.classList.toggle('sidebar-open'); // FIX: Pushes the website over!
    }
    
    // Auto-attach admin keys to all sidebar links when the page loads
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const adminQuery = urlParams.has('admin') ? `?admin=${urlParams.get('admin')}` : '';
        
        const links = ['sb-home', 'sb-docs', 'sb-lead', 'sb-cred', 'sb-logout'];
        links.forEach(id => {
            const el = document.getElementById(id);
            if (el && adminQuery) el.href += adminQuery;
        });

        // Show Mission Control button ONLY if they have the admin key in the URL
        if (urlParams.get('admin')) {
            document.getElementById('sb-admin-li').style.display = 'block';
            document.getElementById('sb-admin').href += adminQuery;
        }
    });

        async function loadTask() {

        const adminQuery = adminKey ? `?admin=${adminKey}` : '';
                
                // --- NEW: Check if the master game clock is running ---
                const stateRes = await fetch('/api/state' + adminQuery);
                const gameState = await stateRes.json();

                // If paused or time is up, visually lock the submission box
                if (!gameState.isRunning || gameState.timeRemaining <= 0) {
                    const flagBox = document.getElementById('flagInput');
                    const submitBtn = document.querySelector('button[onclick="submitFlag()"]');
                    
                    if (flagBox && submitBtn) {
                        flagBox.disabled = true;
                        flagBox.placeholder = " SYSTEM LOCKED (CLOCK STOPPED)";
                        flagBox.style.borderColor = "#d32f2f";
                        
                        submitBtn.disabled = true;
                        submitBtn.innerText = "LOCKED";
                        submitBtn.style.backgroundColor = "#555";
                        submitBtn.style.cursor = "not-allowed";
                        submitBtn.style.boxShadow = "none";
                    }
                }
            try {
                const adminQuery = adminKey ? `?admin=${adminKey}` : '';
                const response = await fetch(`/api/task/${encodeURIComponent(taskIdentifier)}${adminQuery}`);
                
                if (!response.ok) {
                    document.getElementById('taskName').innerText = "ERROR: Task not found.";
                    return;
                }
                
                // Fetch the data FIRST
                const task = await response.json();

                // Fill Player View
                // Fill Player View
                document.getElementById('taskName').innerText = task.name;
                document.getElementById('taskTime').innerText = task.estimated_time;
                document.getElementById('taskDesc').innerHTML = task.description; 

                // --- NEW: Start the Live Timer ---
                // --- NEW: Start the Live Timer & Point Decay ---
                if (task.elapsed_ms !== undefined) {
                    document.getElementById('activeTimer').style.display = 'block';
                    
                    let elapsedSeconds = Math.floor(task.elapsed_ms / 1000);
                    const originalPoints = task.points || 100;
                    const pointsLostPerMinute = 2; 
                    const minimumPoints = 10; 

                    // Function to update UI (Clock and Points)
                    const updateUI = (seconds) => {
                        const mins = Math.floor(seconds / 60);
                        const secs = seconds % 60;
                        document.getElementById('timeElapsed').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                        
                        let currentPoints = originalPoints - (mins * pointsLostPerMinute);
                        currentPoints = Math.max(minimumPoints, currentPoints);
                        document.getElementById('taskPoints').innerText = currentPoints;
                    };

                    // Show the initial time sent by server
                    updateUI(elapsedSeconds);

                    // ONLY start the interval if the task is NOT completed
                    if (!task.isCompleted) {
                        setInterval(() => {
                            elapsedSeconds++;
                            updateUI(elapsedSeconds);
                        }, 1000);
                    } else {
                        // Optional: Mark the timer as finished visually
                        document.getElementById('activeTimer').style.color = "#4caf50";
                        document.getElementById('timeElapsed').innerText += " (COMPLETED)";
                    }
                }
                
                if (task.image_url) {
                    document.getElementById('taskImage').src = task.image_url;
                    document.getElementById('taskImage').style.display = 'block';
                }

                // THEN inject the rich text content into the div
                const contentDiv = document.getElementById('taskContent');
                if (task.content && task.content.trim() !== "<p><br></p>") {
                    contentDiv.innerHTML = task.content;
                } else {
                    contentDiv.innerHTML = `<p>${task.description || "No detailed instructions provided."}</p>`;
                }

                // Show Edit Button if Admin
                if (adminKey) {
                    const editBtn = document.getElementById('editModeBtn');
                    editBtn.classList.remove('hidden');
                    editBtn.onclick = () => {
                        window.location.href = `/game/task/${encodeURIComponent(task.name)}/edit?admin=${adminKey}`;
                    };
                }
            } catch (err) { console.error(err); }
        }

        // --- NEW: Frontend Submission Logic ---
    async function submitFlag() {
    const flagValue = document.getElementById('flagInput').value.trim();
    if (!flagValue) return alert("Please enter a flag first!");

    try {
        const response = await fetch(`/api/task/${encodeURIComponent(taskIdentifier)}/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ flag: flagValue })
        });

        const data = await response.json();
        
        // Show the result to the player
        alert(data.message);
        
        // Clear the box if they got it right
        if (data.success) {
            document.getElementById('flagInput').value = "";
        }
    } catch (err) {
        console.error(err);
        alert("Critical Error: Could not connect to the grading server.");
    }
}

        window.onload = loadTask;
    </script>
</body>
</html>
