<body>
    <a href="javascript:history.back()" style="color: var(--accent); text-decoration: none;">◄ BACK TO TERMINAL</a>
    <br><br>

    <div id="adminPanel" class="admin-controls hidden">
        <h3 style="color: red; margin-top: 0;">🔧 ADMIN EDIT MODE</h3>
        
        <label>Task Name:</label>
        <input type="text" id="editName">
        
        <label>Menu Preview Description (Short):</label>
        <textarea id="editDesc" rows="2"></textarea>

        <label>Detailed Task Instructions (HTML supported for links!):</label>
        <textarea id="editDetailedDesc" rows="6" placeholder="Type instructions here. Use <a href='/link'>Text</a> for links."></textarea>
        
        <label>Detailed Task Image URL (Optional):</label>
        <input type="text" id="editDetailedImage" placeholder="/uploads/your-image.png">
        
        <div style="display: flex; gap: 20px; margin-top: 10px;">
            <div style="flex: 1;">
                <label>Estimated Time:</label>
                <input type="text" id="editTime">
            </div>
            <div style="flex: 1;">
                <label>Points Value:</label>
                <input type="number" id="editPoints">
            </div>
        </div>

        <label style="color: #e066a3; font-weight: bold; margin-top: 10px; display: block;">SECRET FLAG (The Answer):</label>
        <input type="text" id="editFlag" style="border-color: #e066a3;" placeholder="CTF{secret_code_here}">

        <button onclick="saveEdits()" style="margin-top: 15px;">💾 Save Changes & Update</button>
        <span id="saveStatus" style="margin-left: 15px; color: #4caf50;"></span>
    </div>

    <div class="card" id="playerPanel">
        <h1 id="taskName">Loading...</h1>
        <p style="color: white;">⏱ Time: <span id="taskTime">...</span></p>
        
        <img id="taskDetailedImage" src="" class="task-image" alt="Task Execution Image" style="display: none;">
        
        <div id="taskDetailedDesc" style="font-size: 1.2em; line-height: 1.6; color: white; margin-top: 20px;"></div>
        
        <hr style="border-color: var(--accent); margin: 30px 0;">
        
        <h3>SUBMIT FLAG</h3>
        <input type="text" id="flagInput" placeholder="CTF{type_your_flag_here}">
        <button onclick="submitFlag()">Verify Flag</button>
    </div>

<script>
const taskIdentifier = decodeURIComponent(window.location.pathname.split('/').pop());
const urlParams = new URLSearchParams(window.location.search);
const adminKey = urlParams.get('admin');

async function loadTask() {
    try {
        const adminQuery = adminKey ? `?admin=${adminKey}` : '';
        const response = await fetch(`/api/task/${encodeURIComponent(taskIdentifier)}${adminQuery}`);
        
        if (!response.ok) {
            document.getElementById('taskName').innerText = "ERROR: Task not found.";
            return;
        }
        const task = await response.json();

        // Populate Player View
        document.getElementById('taskName').innerText = task.name;
        document.getElementById('taskTime').innerText = task.estimated_time;
        
        // Use innerHTML so injected <a> tags work
        document.getElementById('taskDetailedDesc').innerHTML = task.detailed_instructions || "<em>No detailed instructions provided yet.</em>";
        
        if (task.detailed_image_url) {
            document.getElementById('taskDetailedImage').src = task.detailed_image_url;
            document.getElementById('taskDetailedImage').style.display = 'block';
        }

        // Populate Admin View
        if (adminKey) {
            document.getElementById('adminPanel').classList.remove('hidden');
            document.getElementById('editName').value = task.name || "";
            document.getElementById('editDesc').value = task.description || "";
            document.getElementById('editDetailedDesc').value = task.detailed_instructions || "";
            document.getElementById('editDetailedImage').value = task.detailed_image_url || "";
            document.getElementById('editTime').value = task.estimated_time || "";
            document.getElementById('editPoints').value = task.points || 100;
            document.getElementById('editFlag').value = task.flag || "";
        }
    } catch (err) { console.error(err); }
}

async function saveEdits() {
    const updatedData = {
        adminKey: adminKey,
        name: document.getElementById('editName').value,
        description: document.getElementById('editDesc').value,
        detailed_instructions: document.getElementById('editDetailedDesc').value,
        detailed_image_url: document.getElementById('editDetailedImage').value,
        estimated_time: document.getElementById('editTime').value,
        points: document.getElementById('editPoints').value,
        flag: document.getElementById('editFlag').value
    };

    const response = await fetch(`/api/task/${encodeURIComponent(taskIdentifier)}/edit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(updatedData)
    });

    if (response.ok) {
        const data = await response.json();
        document.getElementById('saveStatus').innerText = "✔ Saved!";
        
        setTimeout(() => {
            window.location.href = `/game/task/${encodeURIComponent(data.newName)}?admin=${adminKey}`;
        }, 1000);
    }
}

function submitFlag() {
    alert("Flag checking logic coming soon!");
}

window.onload = loadTask;
</script>
</body>
