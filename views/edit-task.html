<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Edit Task | Admin</title>
    <style>
        :root { --bg: #1a102a; --panel: #2a1b40; --accent: #e066a3; --text: #ffb74d; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; padding: 30px; max-width: 800px; margin: 0 auto; }
        .card { background: rgba(255, 0, 0, 0.05); border: 1px dashed red; border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 20px;}
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 10px; margin: 10px 0 20px 0; background: #110a1c; border: 1px solid var(--accent); color: white; border-radius: 5px; font-family: inherit; box-sizing: border-box;}
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; font-family: inherit;}
        button:hover { filter: brightness(1.2); }
        label { font-weight: bold; color: var(--text); }
    </style>
</head>
<body>

    <a href="javascript:history.back()" style="color: var(--accent); text-decoration: none;">◄ CANCEL EDITING</a>
    <br><br>

    <div class="card">
        <h2 style="color: red; margin-top: 0;">🔧 TASK EDITOR</h2>
        <p>HTML tags like <code>&lt;a href="/link"&gt;Text&lt;/a&gt;</code> are supported in the description.</p>
        
        <div class="card" style="border-color: var(--accent); border-style: solid; border-width: 1px; margin-bottom: 30px;">
            <h3 style="margin-top: 0; color: var(--accent);">🖼️ MENU ICON</h3>
            <p style="font-size: 0.9em; color: #ccc;">This image appears only on the main dashboard grid.</p>
            
            <label>Upload New Icon:</label>
            <input type="file" id="editImageFile" accept="image/*">
            
            <input type="hidden" id="currentImageUrl">
            
            <div id="imagePreviewContainer" style="margin-top: 10px; display: none;">
                <p style="font-size: 0.8em;">Current Icon:</p>
                <img id="currentIconPreview" src="" style="width: 100px; height: 100px; object-fit: cover; border-radius: 10px; border: 1px solid var(--accent);">
            </div>
        </div>

        <hr style="border: 0; border-top: 1px dashed rgba(224, 102, 163, 0.5); margin: 30px 0;">

        <label>Task Name:</label>
        <input type="text" id="editName">
        
        <label>Main Description & Instructions:</label>
        <textarea id="editDesc" rows="8"></textarea>
        
        <div style="display: flex; gap: 20px;">
            <div style="flex: 1;">
                <label>Estimated Time:</label>
                <input type="text" id="editTime">
            </div>
            <div style="flex: 1;">
                <label>Points Value:</label>
                <input type="number" id="editPoints">
            </div>
        </div>

        <label>Full Formatted Content (Instructions, Links, Images):</label>
        <div id="editor-container" style="height: 350px; background: white; color: black; margin-bottom: 20px; border-radius: 0 0 5px 5px;"></div>

        <label style="color: #e066a3; font-weight: bold; margin-top: 10px; display: block;">SECRET FLAG (The Answer):</label>
        <input type="text" id="editFlag" style="border-color: #e066a3;" placeholder="CTF{secret_code_here}">

        <button onclick="saveEdits()">💾 Save Changes</button>
        <span id="saveStatus" style="margin-left: 15px; color: #4caf50;"></span>
    </div>

    <script>
        document.write('<script src="https://cdn.quilljs.com/1.3.6/quill.js"><\/script>');
        
        const pathParts = window.location.pathname.split('/');
        const taskIdentifier = decodeURIComponent(pathParts[pathParts.length - 2]); 
        
        const urlParams = new URLSearchParams(window.location.search);
        const adminKey = urlParams.get('admin');

        window.addEventListener('DOMContentLoaded', () => {
            window.quill = new Quill('#editor-container', {
                theme: 'snow',
                modules: {
                    toolbar: [
                        [{ 'header': [1, 2, 3, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['link', 'image', 'code-block'],
                        ['clean']
                    ]
                }
            });
        });

async function loadTaskData() {
            try {
                const response = await fetch(`/api/task/${encodeURIComponent(taskIdentifier)}?admin=${adminKey}`);
                if (!response.ok) return alert("Failed to load task data.");
                
                const task = await response.json();
                
                document.getElementById('editName').value = task.name;
                document.getElementById('editDesc').value = task.description;
                document.getElementById('editTime').value = task.estimated_time;
                document.getElementById('editPoints').value = task.points || 100;
                document.getElementById('editFlag').value = task.flag || "";

                // --- NEW: Safely load and preview the existing image! ---
                if (task.image_url) {
                    document.getElementById('currentImageUrl').value = task.image_url;
                    document.getElementById('currentIconPreview').src = task.image_url;
                    document.getElementById('imagePreviewContainer').style.display = 'block';
                }

                if (task.content) {
                    window.quill.root.innerHTML = task.content;
                }
            } catch (err) { console.error(err); }
        }
async function saveEdits() {
    const status = document.getElementById('saveStatus');
    const fileInput = document.getElementById('editImageFile');
    
    // Use FormData to handle the file upload
    const formData = new FormData();
    formData.append('adminKey', adminKey);
    formData.append('name', document.getElementById('editName').value);
    formData.append('description', document.getElementById('editDesc').value);
    formData.append('content', window.quill.root.innerHTML);
    formData.append('estimated_time', document.getElementById('editTime').value);
    formData.append('points', document.getElementById('editPoints').value);
    formData.append('flag', document.getElementById('editFlag').value);
    
    // Send the new file if selected, otherwise send the old URL
    if (fileInput.files[0]) {
        formData.append('taskImage', fileInput.files[0]);
    } else {
        formData.append('existingImageUrl', document.getElementById('currentImageUrl').value);
    }

    try {
        const response = await fetch(`/api/task/${encodeURIComponent(taskIdentifier)}/edit`, {
            method: 'POST',
            body: formData // No headers needed, browser sets Multipart/Form-Data
        });

        if (response.ok) {
            const data = await response.json();
            status.innerText = "✔ Saved! Redirecting...";
            setTimeout(() => {
                window.location.href = `/game/task/${encodeURIComponent(data.newName)}?admin=${adminKey}`;
            }, 1000);
        } else {
            status.innerText = "❌ Error saving.";
        }
    } catch (err) {
        console.error(err);
        status.innerText = "❌ Connection Error.";
    }
}

        window.onload = loadTaskData;
    </script>
</body>
</html>
