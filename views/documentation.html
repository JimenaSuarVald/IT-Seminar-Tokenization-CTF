<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CTF | Documentation</title>
    <style>
        :root { --bg-dark: #1a102a; --text-main: #ffb74d; --accent: #e066a3; --panel-bg: #2a1b40; --sidebar-width: 250px; }
        body { margin: 0; font-family: 'Courier New', monospace; background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
/* --- UNIVERSAL FLOATING SIDEBAR --- */
        .menu-toggle {
            position: fixed; top: 15px; left: 15px; z-index: 1001;
            background: var(--bg-dark, #1a102a); border: 2px solid var(--accent, #e066a3); 
            color: var(--accent, #e066a3); font-size: 1.5em; cursor: pointer; 
            border-radius: 5px; padding: 5px 12px; transition: 0.2s; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .menu-toggle:hover { background-color: var(--accent, #e066a3); color: white; box-shadow: 0 0 15px var(--accent, #e066a3); }

        .sidebar {
            position: fixed; top: 0; left: 0; width: 280px; height: 100vh;
            background-color: var(--panel-bg, #2a1b40);
            transition: transform 0.3s ease; box-shadow: 5px 0 20px rgba(0,0,0,0.8); z-index: 1000;
            display: flex; flex-direction: column; padding-top: 70px; 
            border-right: 2px solid var(--accent, #e066a3);
        }
        .sidebar.collapsed { transform: translateX(-100%); }
        
        .sidebar-menu { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; flex-grow: 1; }
        
        /* The dividing line between buttons */
        .sidebar-menu li { border-bottom: 1px solid var(--accent, #e066a3); }
        .sidebar-menu li:last-child { border-bottom: none; }
        
        /* The text and icons */
        .sidebar-menu li a {
            display: flex; align-items: center; gap: 15px; padding: 20px;
            color: var(--text-main, #ffb74d); text-decoration: none; font-size: 1.1em; 
            font-family: 'Courier New', monospace; font-weight: bold; transition: 0.2s;
        }
        .sidebar-menu li a:hover {
            background-color: rgba(224, 102, 163, 0.2); padding-left: 30px; border-left: 5px solid var(--accent, #e066a3);
        }

        /* --- DEDICATED SIGN OUT ANCHOR --- */
        .sign-out-container { 
            margin-top: auto; 
            border-top: 2px solid var(--accent, #e066a3); 
            background: rgba(211, 47, 47, 0.1); 
        }
        .sign-out-container a { 
            display: flex; align-items: center; gap: 15px; padding: 20px;
            color: #d32f2f; text-decoration: none; font-size: 1.1em; 
            font-family: 'Courier New', monospace; font-weight: bold; transition: 0.2s;
        }
        .sign-out-container a:hover { 
            background-color: rgba(211, 47, 47, 0.2); padding-left: 30px; border-left: 5px solid #d32f2f; 
        }
        /* Content Styles */
        .doc-container { padding: 40px; max-width: 900px; margin: 0 auto; width: 100%; }
        h1 { text-shadow: 0 0 15px var(--accent); text-transform: uppercase; margin-bottom: 30px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .doc-list { display: flex; flex-direction: column; gap: 15px; }
        .doc-item { background: var(--panel-bg); padding: 20px; border-radius: 10px; border: 1px solid rgba(224, 102, 163, 0.3); display: flex; justify-content: space-between; align-items: center; transition: 0.2s; cursor: pointer; }
        .doc-item:hover { border-color: var(--accent); box-shadow: 0 0 15px rgba(224, 102, 163, 0.2); transform: translateX(5px); }
        .doc-title { font-size: 1.3em; color: white; font-weight: bold; }
        
        .admin-controls { margin-bottom: 20px; display: none; }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; font-weight: bold; font-family: inherit; border-radius: 5px; cursor: pointer; }
    
    
    </style>
</head>
<body>
<button class="menu-toggle" onclick="toggleSidebar()">☰</button>

    <nav class="sidebar collapsed" id="sidebar">
        <ul class="sidebar-menu">
            <li><a href="/" id="sb-home">🏠 Main Menu</a></li>
            <li><a href="/documentation" id="sb-docs">📄 Documentation</a></li>
            <li><a href="/leaderboard" id="sb-lead">🏆 Leaderboards</a></li>
            <li><a href="/credits" id="sb-cred">👨‍💻 System Architects</a></li>
            
            <li id="sb-admin-li" style="display: none;"><a href="/supersecretcyber-panel" id="sb-admin">⚙️ Mission Control</a></li>
        </ul>
        
        <div class="sign-out-container">
            <a href="/login" id="sb-logout">🚪 Sign Out</a>
        </div>
    </nav>

    <div class="main-content">
        <header class="topbar">
            <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">☰</button>
        </header>

        <div class="doc-container">
            <h1>SYSTEM ARCHIVES</h1>
            
            <div class="admin-controls" id="adminPanel">
                <button onclick="createNewDoc()">➕ Create New Entry</button>
            </div>

            <div class="doc-list" id="docList">
                <p>Loading archives...</p>
            </div>
        </div>
    </div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const adminQuery = urlParams.has('admin') ? `?admin=${urlParams.get('admin')}` : '';
    
    document.getElementById('home-link').href = '/' + adminQuery;
    document.getElementById('lead-link').href = '/leaderboard' + adminQuery;
    document.getElementById('cred-link').href = '/credits' + adminQuery;

    if (urlParams.get('admin') === 'jillian') {
        document.getElementById('adminPanel').style.display = 'block';
    }

    async function loadDocs() {
        const res = await fetch('/api/documents' + adminQuery);
        const docs = await res.json();
        const list = document.getElementById('docList');
        list.innerHTML = '';

        if (docs.length === 0) { list.innerHTML = '<p>No documents found in the archive.</p>'; return; }

        docs.forEach(doc => {
            const div = document.createElement('div');
            div.className = 'doc-item';
            div.innerHTML = `<span class="doc-title">${doc.title}</span> <span style="color:var(--accent);">Read ➔</span>`;
            div.onclick = () => window.location.href = `/documentation/read/${doc.id}${adminQuery}`;
            list.appendChild(div);
        });
    }

    function createNewDoc() { window.location.href = `/documentation/edit/new${adminQuery}`; }
    window.onload = loadDocs;

    // --- UNIVERSAL SIDEBAR LOGIC ---
    function toggleSidebar() { 
        document.getElementById('sidebar').classList.toggle('collapsed'); 
    }
    
    // Auto-attach admin keys to all sidebar links when the page loads
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const adminQuery = urlParams.has('admin') ? `?admin=${urlParams.get('admin')}` : '';
        
        const links = ['sb-home', 'sb-docs', 'sb-lead', 'sb-cred', 'sb-logout'];
        links.forEach(id => {
            const el = document.getElementById(id);
            if (el && adminQuery) el.href += adminQuery;
        });

        // Show Mission Control button ONLY if they have the admin key in the URL
        if (urlParams.get('admin') === 'jillian') {
            document.getElementById('sb-admin-li').style.display = 'block';
            document.getElementById('sb-admin').href += adminQuery;
        }
    });
</script>
</body>
</html>
